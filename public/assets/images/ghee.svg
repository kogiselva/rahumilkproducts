<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGhee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="15%" stop-color="#FEF3C7" stop-opacity="0.3"/>
      <stop offset="85%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="gheeGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="goldLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.2"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#bgGhee)"/>

  <!-- Radial Glow Behind Jar -->
  <circle cx="300" cy="240" r="170" fill="#FDE68A" opacity="0.6" filter="url(#glow)"/>

  <!-- Pedestal / Table Shadow -->
  <ellipse cx="300" cy="385" rx="180" ry="26" fill="#78350F" opacity="0.18"/>
  <ellipse cx="300" cy="380" rx="150" ry="18" fill="#78350F" opacity="0.25"/>

  <!-- Glass Ghee Jar Container -->
  <g filter="url(#shadow)">
    <!-- Jar Body Fill (Golden Ghee inside) -->
    <path d="M 200 160 C 190 200, 180 320, 205 360 C 220 375, 380 375, 395 360 C 420 320, 410 200, 400 160 Z" fill="url(#gheeGold)"/>
    
    <!-- Granular Texture (Danedar speckles) -->
    <g opacity="0.4" fill="#FEF08A">
      <circle cx="240" cy="220" r="3"/>
      <circle cx="280" cy="205" r="4"/>
      <circle cx="330" cy="230" r="3.5"/>
      <circle cx="360" cy="215" r="2.5"/>
      <circle cx="230" cy="270" r="4"/>
      <circle cx="270" cy="285" r="3"/>
      <circle cx="310" cy="265" r="4.5"/>
      <circle cx="350" cy="290" r="3"/>
      <circle cx="250" cy="330" r="3.5"/>
      <circle cx="300" cy="340" r="4"/>
      <circle cx="340" cy="325" r="3"/>
    </g>

    <!-- Glass Reflection Overlays -->
    <path d="M 200 160 C 190 200, 180 320, 205 360 C 220 375, 380 375, 395 360 C 420 320, 410 200, 400 160 Z" fill="url(#jarGlass)" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.6"/>

    <!-- Left Glass Specular Highlight -->
    <path d="M 215 175 C 205 210, 200 300, 218 345" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.65"/>
    <path d="M 230 185 C 224 210, 220 280, 230 330" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Product Label on Jar -->
    <rect x="225" y="215" width="150" height="95" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5"/>
    <rect x="230" y="220" width="140" height="85" rx="7" fill="#FFFBEB"/>
    
    <!-- Label Brand Icon & Text -->
    <circle cx="300" cy="242" r="14" fill="#D97706"/>
    <text x="300" y="247" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🥛</text>
    <text x="300" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#78350F" text-anchor="middle" letter-spacing="1">RAHU DESI GHEE</text>
    <text x="300" y="284" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">100% PURE BILONA</text>
    <text x="300" y="296" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#B45309" text-anchor="middle">Sivakasi • Fresh Daily</text>

    <!-- Jar Neck & Golden Lid -->
    <rect x="225" y="145" width="150" height="18" rx="4" fill="#D97706" opacity="0.7"/>
    <rect x="215" y="125" width="170" height="26" rx="8" fill="url(#goldLid)" stroke="#FDE68A" stroke-width="2"/>
    <!-- Lid Ridges -->
    <line x1="235" y1="126" x2="235" y2="150" stroke="#78350F" stroke-width="1.5" opacity="0.5"/>
    <line x1="260" y1="126" x2="260" y2="150" stroke="#78350F" stroke-width="1.5" opacity="0.5"/>
    <line x1="285" y1="126" x2="285" y2="150" stroke="#78350F" stroke-width="1.5" opacity="0.5"/>
    <line x1="315" y1="126" x2="315" y2="150" stroke="#78350F" stroke-width="1.5" opacity="0.5"/>
    <line x1="340" y1="126" x2="340" y2="150" stroke="#78350F" stroke-width="1.5" opacity="0.5"/>
    <line x1="365" y1="126" x2="365" y2="150" stroke="#78350F" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Brass Spoon with dripping Golden Ghee -->
  <g transform="rotate(-25 430 260)" filter="url(#shadow)">
    <!-- Handle -->
    <path d="M 430 120 L 440 280 C 440 300, 420 310, 400 310 C 380 310, 360 300, 360 280 Z" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
    <!-- Liquid Ghee in Spoon -->
    <ellipse cx="400" cy="285" rx="30" ry="18" fill="#FDE047"/>
    <!-- Ghee Drop Falling -->
    <path d="M 400 315 C 395 325, 390 335, 400 345 C 410 335, 405 325, 400 315 Z" fill="#F59E0B"/>
  </g>

  <!-- Decorative Badge Top Left -->
  <g transform="translate(35, 35)">
    <rect width="130" height="34" rx="17" fill="#059669" filter="url(#shadow)"/>
    <text x="65" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✨ 100% PURE GHEE</text>
  </g>

  <!-- Price Badge Top Right -->
  <g transform="translate(425, 35)">
    <rect width="140" height="42" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#78350F" text-anchor="middle">500ml ₹400</text>
    <text x="70" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#D97706" text-anchor="middle">1 Litre ₹800</text>
  </g>
</svg>
