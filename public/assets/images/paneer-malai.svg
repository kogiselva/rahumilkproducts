<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPaneer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="woodBoard" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="cubeSideLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cubeSideRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgPaneer)"/>

  <!-- Radial Soft Glow -->
  <circle cx="300" cy="240" r="180" fill="#E0F2FE" opacity="0.6"/>

  <!-- Rustic Wooden Chopping Board -->
  <g filter="url(#pShadow)">
    <rect x="80" y="160" width="440" height="210" rx="20" fill="url(#woodBoard)"/>
    <rect x="90" y="170" width="420" height="190" rx="14" fill="#92400E" opacity="0.3"/>
    <!-- Wood Grain lines -->
    <path d="M 100 200 Q 300 195 500 205" stroke="#78350F" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M 110 240 Q 310 235 490 245" stroke="#78350F" stroke-width="2.5" fill="none" opacity="0.25"/>
    <path d="M 95 285 Q 280 290 505 280" stroke="#78350F" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M 120 330 Q 320 325 480 335" stroke="#78350F" stroke-width="1.8" fill="none" opacity="0.2"/>
  </g>

  <!-- Big Fresh Paneer Block (Center Left) -->
  <g filter="url(#pShadow)">
    <!-- Top Face -->
    <polygon points="170,190 290,150 370,185 250,225" fill="url(#cubeTop)" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Left Face -->
    <polygon points="170,190 250,225 250,305 170,270" fill="url(#cubeSideLeft)" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Right Face -->
    <polygon points="250,225 370,185 370,265 250,305" fill="url(#cubeSideRight)" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Texture dots -->
    <circle cx="230" cy="205" r="2" fill="#CBD5E1"/>
    <circle cx="280" cy="180" r="1.5" fill="#CBD5E1"/>
    <circle cx="310" cy="200" r="2" fill="#CBD5E1"/>
  </g>

  <!-- Smaller Paneer Cube 1 (Front Center) -->
  <g filter="url(#pShadow)">
    <polygon points="290,270 340,250 380,265 330,285" fill="url(#cubeTop)"/>
    <polygon points="290,270 330,285 330,325 290,310" fill="url(#cubeSideLeft)"/>
    <polygon points="330,285 380,265 380,305 330,325" fill="url(#cubeSideRight)"/>
  </g>

  <!-- Smaller Paneer Cube 2 (Right Front) -->
  <g filter="url(#pShadow)">
    <polygon points="360,250 410,230 450,245 400,265" fill="url(#cubeTop)"/>
    <polygon points="360,250 400,265 400,305 360,290" fill="url(#cubeSideLeft)"/>
    <polygon points="400,265 450,245 450,285 400,305" fill="url(#cubeSideRight)"/>
  </g>

  <!-- Smaller Paneer Cube 3 (Stacked on Big Block) -->
  <g filter="url(#pShadow)">
    <polygon points="250,150 295,130 330,145 285,165" fill="url(#cubeTop)"/>
    <polygon points="250,150 285,165 285,195 250,180" fill="url(#cubeSideLeft)"/>
    <polygon points="285,165 330,145 330,175 285,195" fill="url(#cubeSideRight)"/>
  </g>

  <!-- Fresh Garnish: Green Mint Leaves on Top -->
  <g transform="translate(285, 130)">
    <path d="M 0 0 C 15 -20, 35 -15, 30 10 C 20 15, 5 10, 0 0 Z" fill="#10B981"/>
    <path d="M 0 0 C 20 -5, 25 15, 10 25 C 0 20, 0 10, 0 0 Z" fill="#059669"/>
    <!-- Leaf Veins -->
    <path d="M 2 2 Q 18 -5 28 8" stroke="#D1FAE5" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Chili Flakes & Coriander Specs -->
  <circle cx="240" cy="250" r="2.5" fill="#EF4444"/>
  <circle cx="340" cy="275" r="2" fill="#EF4444"/>
  <circle cx="210" cy="210" r="1.5" fill="#10B981"/>
  <circle cx="280" cy="265" r="2" fill="#10B981"/>
  <circle cx="420" cy="270" r="2" fill="#EF4444"/>

  <!-- Top Badges -->
  <g transform="translate(35, 35)">
    <rect width="165" height="34" rx="17" fill="#059669" filter="url(#pShadow)"/>
    <text x="82" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🧀 SUPER SOFT MALAI</text>
  </g>

  <g transform="translate(425, 35)">
    <rect width="140" height="42" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2" filter="url(#pShadow)"/>
    <text x="70" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Malai Paneer</text>
    <text x="70" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#059669" text-anchor="middle">1 kg ₹460</text>
  </g>
</svg>
