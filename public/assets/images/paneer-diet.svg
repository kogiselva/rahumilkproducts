<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDiet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="50%" stop-color="#DCFCE7"/>
      <stop offset="100%" stop-color="#BBF7D0"/>
    </linearGradient>
    <linearGradient id="slateBoard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="dietPaneer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="dietShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#064E3B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#bgDiet)"/>
  <circle cx="300" cy="240" r="170" fill="#86EFAC" opacity="0.3"/>

  <!-- Dark Slate Board for Fitness Look -->
  <g filter="url(#dietShadow)">
    <rect x="90" y="150" width="420" height="220" rx="18" fill="url(#slateBoard)"/>
    <!-- Slate texture -->
    <path d="M 100 230 L 500 230" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  </g>

  <!-- High-Density Firm Diet Paneer Blocks -->
  <g filter="url(#dietShadow)">
    <!-- Main Center Block -->
    <polygon points="180,180 300,140 380,175 260,215" fill="#FFFFFF" stroke="#CBD5E1"/>
    <polygon points="180,180 260,215 260,295 180,260" fill="#F8FAFC" stroke="#CBD5E1"/>
    <polygon points="260,215 380,175 380,255 260,295" fill="#E2E8F0" stroke="#CBD5E1"/>
  </g>

  <!-- Cubed Diet Portions -->
  <g filter="url(#dietShadow)">
    <polygon points="300,260 350,240 390,255 340,275" fill="#FFFFFF"/>
    <polygon points="300,260 340,275 340,315 300,300" fill="#F1F5F9"/>
    <polygon points="340,275 390,255 390,295 340,315" fill="#E2E8F0"/>

    <polygon points="380,240 425,222 460,235 415,253" fill="#FFFFFF"/>
    <polygon points="380,240 415,253 415,288 380,275" fill="#F1F5F9"/>
    <polygon points="415,253 460,235 460,270 415,288" fill="#E2E8F0"/>
  </g>

  <!-- Fitness Tape Measure Graphics around board edge -->
  <path d="M 90 350 Q 300 375 510 350" stroke="#FBBF24" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Tape markings -->
  <path d="M 110 345 L 110 355 M 130 347 L 130 357 M 150 349 L 150 359 M 170 350 L 170 360 M 190 351 L 190 361 M 210 352 L 210 362 M 230 353 L 230 363 M 250 353 L 250 363 M 270 354 L 270 364 M 290 354 L 290 364 M 310 354 L 310 364 M 330 354 L 330 364 M 350 353 L 350 363 M 370 352 L 370 362 M 390 351 L 390 361 M 410 350 L 410 360 M 430 348 L 430 358 M 450 346 L 450 356 M 470 344 L 470 354 M 490 342 L 490 352" stroke="#78350F" stroke-width="2"/>

  <!-- Protein Badge Icon -->
  <g transform="translate(270, 115)" filter="url(#dietShadow)">
    <circle cx="30" cy="30" r="26" fill="#059669" stroke="#FFFFFF" stroke-width="3"/>
    <text x="30" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">20g+</text>
    <text x="30" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#D1FAE5" text-anchor="middle">PROTEIN</text>
  </g>

  <!-- Top Badges -->
  <g transform="translate(35, 35)">
    <rect width="170" height="34" rx="17" fill="#059669" filter="url(#dietShadow)"/>
    <text x="85" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🥗 BALANCED DIET PANEER</text>
  </g>

  <g transform="translate(425, 35)">
    <rect width="140" height="42" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#dietShadow)"/>
    <text x="70" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#064E3B" text-anchor="middle">Diet Paneer</text>
    <text x="70" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#059669" text-anchor="middle">1 kg ₹460</text>
  </g>
</svg>
